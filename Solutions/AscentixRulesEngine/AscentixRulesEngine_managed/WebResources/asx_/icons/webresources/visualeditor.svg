<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Visual Editor: Pencil drawing a flowchart -->
  <!-- Pencil (top-right, angled down-left, "drawing" the flow) -->
  <path d="M29 2 L31 4 L18.5 16.5 L16 17.5 L17 15 Z" fill="none" stroke="#605E5C" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="27" y1="4" x2="29" y2="6" stroke="#605E5C" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Flowchart emerging from pencil tip -->
  <!-- Start node (where pencil meets the flow) -->
  <rect x="4" y="3" width="9" height="5" rx="2.5" fill="none" stroke="#605E5C" stroke-width="1.3"/>
  <!-- Connector down -->
  <line x1="8.5" y1="8" x2="8.5" y2="11" stroke="#605E5C" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Decision diamond -->
  <path d="M8.5 11 L12.5 15 L8.5 19 L4.5 15 Z" fill="none" stroke="#605E5C" stroke-width="1.3" stroke-linejoin="round"/>
  <!-- Left branch -->
  <line x1="4.5" y1="15" x2="2" y2="15" stroke="#605E5C" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="2" y1="15" x2="2" y2="21" stroke="#605E5C" stroke-width="1.3" stroke-linecap="round"/>
  <rect x="-1" y="21" width="6" height="4" rx="2" fill="none" stroke="#605E5C" stroke-width="1.3"/>
  <!-- Right branch (trails toward pencil tip) -->
  <line x1="12.5" y1="15" x2="15" y2="15" stroke="#605E5C" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="15" y1="15" x2="15" y2="21" stroke="#605E5C" stroke-width="1.3" stroke-linecap="round"/>
  <rect x="12" y="21" width="6" height="4" rx="2" fill="none" stroke="#605E5C" stroke-width="1.3"/>
</svg>